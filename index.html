<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devops registration form </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page-wrapper">
        <section class="registration-card" aria-labelledby="form-title">
            <div class="form-header">
                <p class="eyebrow">Join the community</p>
                <h1 id="form-title">Create your account</h1>
                <p class="subtitle">Register for the DevOps community and start learning today.</p>
            </div>

            <form action="#" method="post">
                <div class="form-row">
                    <div class="form-group">
                        <label for="first-name">First name</label>
                        <input type="text" id="first-name" name="first_name" autocomplete="given-name" required>
                    </div>
                    <div class="form-group">
                        <label for="last-name">Last name</label>
                        <input type="text" id="last-name" name="last_name" autocomplete="family-name" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label for="role">Your role</label>
                    <select id="role" name="role" required>
                        <option value="" disabled selected>Select your role</option>
                        <option value="developer">Developer</option>
                        <option value="devops-engineer">DevOps Engineer</option>
                        <option value="student">Student</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" minlength="8" autocomplete="new-password" required>
                    <small>Use at least 8 characters.</small>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.</label>
                </div>

                <button type="submit">Create account</button>
            </form>

            <p class="login-prompt">Already have an account? <a href="#">Sign in</a></p>
        </section>
    </main>
</body>
</html>
